<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>BOKTORI · 십이간지 복토리</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#000;
      color:#fff;
      overflow:hidden;
    }

    /* 🔹 전체 배경 GIF */
    .bg-gif{
      position:fixed;
      inset:0;
      background:black url("assets/bg_gif1.gif") center center / cover no-repeat;
      z-index:0;
    }

    /* 🔹 내용 오버레이 */
    .overlay{
      position:relative;
      z-index:1;
      width:100%;
      height:100vh;
      padding:16px;
      display:flex;
      flex-direction:column;
    }

    /* 🔹 좌측 상단 BOKTORI 로고 */
    .logo{
      font-size:26px;
      font-weight:900;
      letter-spacing:4px;
      text-transform:uppercase;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(0,0,0,0.45);
      display:inline-block;
    }

    /* 🔹 중앙 대화 영역 */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:0 16px 32px;
    }

    .bubble{
      max-width:520px;
      width:100%;
      min-height:120px;
      background:rgba(0,0,0,0.55);
      border-radius:24px;
      padding:18px 18px 16px;
      box-shadow:0 12px 30px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.16);
    }

    .speaker{
      font-size:14px;
      font-weight:700;
      color:#ffd9f1;
      margin-bottom:4px;
      text-align:left;
    }

    .text{
      font-size:18px;
      line-height:1.7;
      text-align:left;
      white-space:pre-wrap;
      min-height:72px;
    }

    .hint{
      margin-top:8px;
      font-size:12px;
      color:rgba(255,255,255,0.7);
    }

    /* 🔹 띠 선택 버튼들 */
    .zodiac-wrap{
      margin-top:18px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      max-width:520px;
    }
    .zodiac-btn{
      border:none;
      border-radius:999px;
      padding:8px 14px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      background:rgba(0,0,0,0.65);
      color:#ffeef8;
      border:1px solid rgba(255,255,255,0.35);
      transition:transform .1s ease, background .1s ease, box-shadow .1s ease;
      backdrop-filter:blur(6px);
    }
    .zodiac-btn:hover{
      transform:translateY(-1px);
      background:rgba(255,194,234,0.9);
      color:#3b0030;
      box-shadow:0 6px 14px rgba(0,0,0,0.35);
    }
    .zodiac-btn:active{
      transform:translateY(0);
      box-shadow:none;
    }

    @media (min-width:768px){
      .logo{font-size:30px;}
      .text{font-size:20px;}
      .bubble{padding:22px 22px 18px;}
    }
  </style>
</head>
<body>
  <!-- 🔹 배경 GIF (기본: GIF파일1) -->
  <!-- TODO: 실제 파일 경로로 교체: assets/bg_gif1.gif -->
  <div class="bg-gif" id="bgGif"></div>

  <div class="overlay">
    <div class="logo">BOKTORI</div>

    <div class="main" id="mainArea">
      <div class="bubble" id="bubble">
        <div class="speaker" id="speaker">복토리</div>
        <div class="text" id="dialogText"></div>
        <div class="hint" id="hintText">화면을 한 번 더 눌러볼까?</div>
      </div>

      <div class="zodiac-wrap" id="zodiacWrap" style="display:none;"></div>
    </div>
  </div>

  <script>
    // 🔹 대사들
    const firstLine  = "안녕! 반가워!\n우리는 십이간지 복토리들이야!";
    const secondLine = "당신은 무슨띠에요?";

    // 🔹 띠별 정보 (GIF + 대사)
    // TODO: 각 gif 경로를 실제 파일명에 맞게 수정해줘.
    const zodiacData = {
      "쥐": { gif: "assets/zodiac_rat.gif",   line: "나는 쥐띠 복토리! 작은 시작이 큰 복을 만들 거야." },
      "소": { gif: "assets/zodiac_ox.gif",    line: "나는 소띠 복토리! 차근차근, 하지만 끝까지 가는 힘을 줄게." },
      "호랑이": { gif: "assets/zodiac_tiger.gif", line: "나는 호랑이띠 복토리! 용기 100% 타이밍 운까지 챙겨왔어." },
      "토끼": { gif: "assets/zodiac_rabbit.gif", line: "나는 토끼띠 복토리! 포근한 행운이 사뿐사뿐 다가가고 있어." },
      "용": { gif: "assets/zodiac_dragon.gif", line: "나는 용띠 복토리! 크게 비상하는 기운을 듬뿍 얹어줄게." },
      "뱀": { gif: "assets/zodiac_snake.gif",  line: "나는 뱀띠 복토리! 눈치와 직감이 오늘 널 도와줄 거야." },
      "말": { gif: "assets/zodiac_horse.gif",  line: "나는 말띠 복토리! 속도감 있게 앞으로 달려볼까?" },
      "양": { gif: "assets/zodiac_sheep.gif",  line: "나는 양띠 복토리! 포근포근한 인연 운을 챙겨왔어." },
      "원숭이": { gif: "assets/zodiac_monkey.gif", line: "나는 원숭이띠 복토리! 센스와 재치가 오늘의 무기야." },
      "닭": { gif: "assets/zodiac_rooster.gif", line: "나는 닭띠 복토리! 부지런한 시작이 복을 깨우고 있어." },
      "개": { gif: "assets/zodiac_dog.gif",   line: "나는 개띠 복토리! 믿음직한 동료 운을 붙여줄게." },
      "돼지": { gif: "assets/zodiac_pig.gif", line: "나는 돼지띠 복토리! 먹을 복, 금전운 살짝 더 올려줄까?" }
    };

    // 🔹 DOM
    const dialogTextEl = document.getElementById("dialogText");
    const hintTextEl   = document.getElementById("hintText");
    const zodiacWrapEl = document.getElementById("zodiacWrap");
    const bgGifEl      = document.getElementById("bgGif");
    const bubbleEl     = document.getElementById("bubble");

    let state = "intro1";   // intro1 → intro1_done → intro2 → intro2_done → chosen
    let isTyping = false;

    // 🔹 타이핑 효과
    function typeLine(text, callback){
      isTyping = true;
      dialogTextEl.textContent = "";
      let idx = 0;

      const timer = setInterval(() => {
        if (idx >= text.length){
          clearInterval(timer);
          isTyping = false;
          if (callback) callback();
          return;
        }
        const ch = text[idx++];
        dialogTextEl.textContent += ch;
      }, 80); // 글자 속도
    }

    // 🔹 띠 버튼 만들기
    function showZodiacButtons(){
      zodiacWrapEl.innerHTML = "";
      zodiacWrapEl.style.display = "flex";
      hintTextEl.textContent = "내 띠를 골라볼까?";

      Object.keys(zodiacData).forEach(name => {
        const btn = document.createElement("button");
        btn.className = "zodiac-btn";
        btn.textContent = name + "띠";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          pickZodiac(name);
        });
        zodiacWrapEl.appendChild(btn);
      });
    }

    // 🔹 띠 선택 시 동작
    function pickZodiac(name){
      const info = zodiacData[name];
      if (!info) return;

      state = "chosen";
      // 배경 GIF 교체
      bgGifEl.style.backgroundImage = `url("${info.gif}")`;

      // 말풍선 화자 이름 바꾸기
      document.getElementById("speaker").textContent = name + "띠 복토리";

      // 안내 문구 업데이트
      hintTextEl.textContent = "다른 띠도 다시 눌러볼 수 있어요 :)";

      // 대사 출력
      typeLine(info.line);
    }

    // 🔹 첫 진입 시: 1번 대사 출력
    window.addEventListener("load", () => {
      typeLine(firstLine, () => {
        state = "intro1_done";
        hintTextEl.textContent = "화면을 한 번 눌러볼까?";
      });
    });

    // 🔹 화면 클릭 시 상태 전환
    document.body.addEventListener("click", () => {
      if (isTyping) return;

      if (state === "intro1_done"){
        state = "intro2";
        typeLine(secondLine, () => {
          state = "intro2_done";
          showZodiacButtons();
        });
      }
    }, false);
  </script>
</body>
</html>
