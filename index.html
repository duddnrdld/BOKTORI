<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>BOKTORI · 십이간지 복토리</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <!-- 배경 GIF -->
  <div class="bg-gif" id="bgGif"></div>

  <div class="overlay">
    <!-- 좌측 상단 로고 -->
    <div class="logo">BOKTORI</div>

    <!-- 중앙 대화 영역 -->
    <main class="main" id="mainArea">
      <section class="bubble" id="bubble">
        <div class="speaker" id="speaker">복토리</div>
        <div class="meta" id="metaText"></div>
        <div class="text" id="dialogText"></div>
        <div class="hint" id="hintText">화면을 한 번 눌러볼까?</div>
      </section>

      <section class="zodiac-wrap" id="zodiacWrap" style="display:none;"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
